# Moonlang on Coolify (ADR-004). Deploy as a "Docker Compose" resource.
# Traffic: visitor → Cloudflare (DNS, WAF, TLS) → Cloudflare Tunnel → cloudflared → web:3000.
# No service publishes a port on the VPS, and no domain is set in Coolify:
# the hostname is configured in the tunnel (Cloudflare Zero Trust → Tunnels).
# Variables marked with :? must be set in Coolify's "Environment Variables" tab.

x-app-env: &app-env
  DATABASE_URL: postgres://moonlang:${POSTGRES_PASSWORD:?}@postgres:5432/moonlang
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}

services:
  # Postgres with a persistent volume. Only reachable inside this compose network.
  postgres:
    image: postgres:17.10-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: moonlang
      POSTGRES_USER: moonlang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonlang -d moonlang"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  # One-shot: applies migrations and the seed, then exits. Runs on every deploy before web.
  migrate:
    build:
      context: .
      target: tools
    restart: "no"
    environment:
      <<: *app-env
      # Set both only for the first deploy, then remove them.
      SEED_ROOT_EMAIL: ${SEED_ROOT_EMAIL:-}
      SEED_ROOT_PASSWORD: ${SEED_ROOT_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  # Next.js (pages, server actions, API, auth).
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      <<: *app-env
      CRON_SECRET: ${CRON_SECRET:?}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 1536m

  # Calls the job routes on schedule (billing, reminders, maintenance).
  scheduler:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ["node", "scheduler.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
      SCHEDULER_TARGET_URL: http://web:3000
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m

  # Daily logical backup (pg_dump), 14 days kept in the "backups" volume.
  # Copy this volume off the VPS too: a backup on the same disk does not survive losing the VPS.
  db-backup:
    image: postgres:17.10-alpine3.24
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: moonlang
      PGDATABASE: moonlang
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file="/backups/moonlang-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$file.partial"; then
            mv "$$file.partial" "$$file" && echo "backup ok: $$file"
          else
            rm -f "$$file.partial"; echo "backup FAILED" >&2
          fi
          find /backups -name 'moonlang-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  # Outbound-only connection to Cloudflare. Public hostname → http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m

volumes:
  pgdata:
  backups:
